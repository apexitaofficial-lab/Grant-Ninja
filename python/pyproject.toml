[tool.pytest.ini_options]
# The pipeline is run as `python -m app.health`, so the package root is the
# working directory. Tests import the same way.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
